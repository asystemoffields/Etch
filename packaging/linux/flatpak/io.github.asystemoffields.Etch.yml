# Flatpak manifest for Etch, ready for a Flathub submission.
#
# Flatpak builds run offline, so the crate sources must be vendored first. From the repo root:
#
#   curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/linux/flatpak/cargo-sources.json
#   flatpak-builder --user --install --force-clean build-flatpak packaging/linux/flatpak/io.github.asystemoffields.Etch.yml
#   flatpak run io.github.asystemoffields.Etch
#
# For Flathub, replace the `dir` source with a `git` source pinned to a release tag and commit.
# The release's .flatpak bundles come from io.github.asystemoffields.Etch.bundle.yml instead (see there);
# keep runtime, runtime-version, sdk and finish-args identical in both (packaging-lint checks this).
id: io.github.asystemoffields.Etch
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: etch
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Open/Save dialogs go through the file-chooser portal (rfd's xdg-portal backend) and
  # drag-and-drop through the document portal, so picked files work anywhere without broad
  # filesystem access. Documents and Pictures are granted so files passed by path (the command
  # line, Open Recent, "Save" next to the original) work in the usual places.
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures
  # Deliberately not granted: network (the optional --control server listens on 127.0.0.1 in
  # the sandbox; `flatpak override --user --share=network io.github.asystemoffields.Etch` exposes it to
  # host agents) and home/host filesystem access.
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: etch
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/etch/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked -p wordcraft -p wordcraft-cli
      # The cargo packages are wordcraft and wordcraft-cli; their binaries are etch and etch-cli.
      - install -Dm755 target/release/etch /app/bin/etch
      - install -Dm755 target/release/etch-cli /app/bin/etch-cli
      - install -Dm644 packaging/linux/io.github.asystemoffields.Etch.desktop /app/share/applications/io.github.asystemoffields.Etch.desktop
      - install -Dm644 packaging/linux/io.github.asystemoffields.Etch.mime.xml /app/share/mime/packages/io.github.asystemoffields.Etch.xml
      # Flatpak exports only icons named after the app id; the sources keep their own names.
      - >-
        for src in assets/app-icon/hicolor/*/apps/*.png assets/app-icon/hicolor/*/apps/*.svg; do
        size=$(basename $(dirname $(dirname $src)));
        install -Dm644 $src /app/share/icons/hicolor/$size/apps/io.github.asystemoffields.Etch.${src##*.};
        done
      - >-
        version=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml);
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
        packaging/linux/io.github.asystemoffields.Etch.metainfo.xml.in > /app/share/metainfo/io.github.asystemoffields.Etch.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - dist
          - corpus
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
