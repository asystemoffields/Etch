[package]
name = "wordcraft-tz"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft local time: the offset from UTC in force at an instant, from TZif zone files and POSIX TZ rules (Unix), the browser (web) or Windows' own zone"

[lints]
workspace = true

# Nothing on Unix: the zone files are read by our own TZif reader.

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser's zone (`Date.getTimezoneOffset`); already in the tree.
js-sys = "0.3"

[target.'cfg(windows)'.dependencies]
# Windows' own zone, through the Windows Runtime calendar (a safe API); already in the tree for
# the desktop app's theme and region.
windows = { version = "0.62", features = ["Globalization"] }
